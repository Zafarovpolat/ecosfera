<header class="header">

  <!-- Логотип -->
  <div class="header__logo-wrap">
    <img
      src="images/image-31-7848d9a61e.webp"
      alt="Экосфера"
      width="114"
      height="97"
      loading="eager"
      decoding="async"
      class="header__logo"
    />
  </div>

  <!-- Навигация (десктоп в потоке, мобильная — drawer) -->
  <nav
    id="mobile-menu"
    aria-label="Основная навигация"
    class="header__nav"
  >
    <ul class="header__nav-list" role="list">
      <li>
        <a href="#doma" class="header__nav-link">Дома</a>
      </li>
      <li>
        <span class="header__nav-divider" aria-hidden="true"></span>
        <a href="#uslugi" class="header__nav-link">Услуги</a>
      </li>
      <li>
        <span class="header__nav-divider" aria-hidden="true"></span>
        <a href="#gallery" class="header__nav-link">Галерея</a>
      </li>
      <li>
        <span class="header__nav-divider" aria-hidden="true"></span>
        <a href="#faq" class="header__nav-link">Вопросы</a>
      </li>
      <li>
        <span class="header__nav-divider" aria-hidden="true"></span>
        <a href="#contacts" class="header__nav-link">Контакты</a>
      </li>
    </ul>
  </nav>

  <!-- Контакты + CTA (десктоп) -->
  <div class="header__contacts">
    <div class="header__contacts-group">
      <!-- email -->
      <address class="header__contact-item">
        <a href="mailto:Ecosfera2026@mail.ru" class="header__contact-value">
          Ecosfera2026@mail.ru
        </a>
        <button type="button" class="header__contact-label">Написать нам</button>
      </address>

      <span class="header__contacts-divider" aria-hidden="true"></span>

      <!-- phone -->
      <address class="header__contact-item">
        <a href="tel:+79502824382" class="header__contact-value">
          +7 (950) 282-43-82
        </a>
        <button type="button" class="header__contact-label">Заказать звонок</button>
      </address>
    </div>

    <!-- CTA -->
    <a href="#booking" class="header__cta">
      <!-- Уголки инлайном, а не <img>: только так они наследуют color
           кнопки и перекрашиваются на ховере. -->
      <svg class="header__cta-corner header__cta-corner--tl" width="9" height="8"
           viewBox="0 0 9 8" fill="none" aria-hidden="true" focusable="false">
        <path d="M1 8V1H9" stroke="currentColor" stroke-width="1" />
      </svg>
      <span>Забронировать дом</span>
      <svg class="header__cta-corner header__cta-corner--br" width="9" height="8"
           viewBox="0 0 9 8" fill="none" aria-hidden="true" focusable="false">
        <path d="M8 0V7H0" stroke="currentColor" stroke-width="1" />
      </svg>
    </a>
  </div>

  <!-- Мобильный: телефон + кнопка-бургер -->
  <div class="header__mobile-actions">
    <address class="header__contact-item">
      <a href="tel:+79502824382" class="header__contact-value">
        +7 (950) 282-43-82
      </a>
      <button type="button" class="header__contact-label">Заказать звонок</button>
    </address>

    <button
      type="button"
      class="header__burger"
      aria-expanded="false"
      aria-controls="mobile-menu"
      aria-label="Открыть меню"
    >
      <img
        src="icons/vector-2.svg"
        alt=""
        aria-hidden="true"
        class="header__burger-icon"
        width="33"
        height="9"
      />
      <span class="header__burger-label">Меню</span>
    </button>
  </div>

</header>
