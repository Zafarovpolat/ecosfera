name: Build

# Verifies the Next.js source still typechecks and exports.
#
# The live site is published from the gh-pages branch, which already holds a
# working static build, so publishing sits behind a manual dispatch — a push
# should never be able to silently replace a good deployment with a bad one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this build to gh-pages'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` — the project ships without a lockfile and the npm
      # cache requires one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ecosfera

      - name: Sanity-check the export
        run: |
          test -f out/index.html || { echo "no index.html in out/"; exit 1; }
          touch out/.nojekyll
          echo "exported $(find out -type f | wc -l) files, $(du -sh out | cut -f1)"

      - name: Publish to gh-pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
